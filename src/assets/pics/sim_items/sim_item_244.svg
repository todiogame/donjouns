<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1050" viewBox="0 0 750 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#354753"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
  </defs>
  <rect width="750" height="1050" rx="36" fill="#101010"/>
  <rect x="28" y="28" width="694" height="994" rx="28" fill="url(#bg)" stroke="#d6c38a" stroke-width="10"/>
  <rect x="70" y="340" width="610" height="420" rx="18" fill="rgba(255,255,255,0.08)" stroke="#d6c38a" stroke-width="3"/>
  <text x="375" y="82" text-anchor="middle" class="kind">Objet</text>
  <text x="375" y="145" text-anchor="middle" class="title">Tambour de Kui</text>
  <text x="375" y="300" text-anchor="middle" class="sigil">DONJOUNS</text>
  <text x="375" y="520" text-anchor="middle" class="body">Regardez les 4 premières</text>
<text x="375" y="554" text-anchor="middle" class="body">cartes du Donjon, défaussez-en</text>
<text x="375" y="588" text-anchor="middle" class="body">si vous voulez, et reposez les</text>
<text x="375" y="622" text-anchor="middle" class="body">autres dans l&#x27;ordre. Gagnez</text>
<text x="375" y="656" text-anchor="middle" class="body">autant de PV que vous avez</text>
<text x="375" y="690" text-anchor="middle" class="body">reposé de cartes.</text>
  <style>
    .kind { font: 700 34px Arial, sans-serif; fill: #f8efd0; letter-spacing: 0; }
    .title { font: 800 42px Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
    .sigil { font: 800 46px Arial, sans-serif; fill: rgba(255,255,255,0.20); letter-spacing: 0; }
    .body { font: 600 28px Arial, sans-serif; fill: #f6f0dd; letter-spacing: 0; }
  </style>
</svg>
